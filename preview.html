const products=[['product-mix.jpg','Mộc Mì nhiều màu','Hình ảnh sản phẩm Mộc Mì trong bao bì thực tế'],['product-pink.jpg','Mộc Mì sắc màu','Sản phẩm được đóng gói trong túi riêng'],['product-color.jpg','Mộc Mì đủ sắc','Những sắc màu bắt mắt, gần gũi'],['product-yellow.jpg','Mộc Mì vàng – xanh','Ảnh sản phẩm thực tế do thương hiệu cung cấp'],['product-tray.jpg','Mộc Mì trình bày','Hình ảnh sản phẩm trong khay đựng'],['students.jpg','Mộc Mì và tuổi trẻ','Hình ảnh giới thiệu sản phẩm cùng các bạn học sinh']];
function App(){const [menu,setMenu]=React.useState(false),[photo,setPhoto]=React.useState(null);return <><div className="topline">MỘC MÌ · THƠM THẢO CỦ MÌ QUÊ NHÀ · CÀNG LONG, VĨNH LONG</div><header className="header"><div className="container nav"><a className="brand" href="#home"><img src={A+'logo.png'}/><span>MỘC MÌ</span></a><button className="menu" onClick={()=>setMenu(!menu)}>☰</button><nav className={'navlinks '+(menu?'open':'')}><a href="#home">Trang chủ</a><a href="#story">Câu chuyện</a><a href="#products">Sản phẩm</a><a href="#video">Video</a><a href="#contact">Liên hệ</a></nav><a className="nav-cta" href="tel:0939214577">Gọi đặt hàng</a></div></header><main><section className="hero" id="home"><div className="container hero-grid"><div><div className="eyebrow">Hương vị mộc mạc miền Tây</div><h1>Thơm thảo<br/><em>Mộc Mì</em></h1><div className="slogan">THƠM THẢO CỦ MÌ QUÊ NHÀ</div><p>Từ củ mì thân thuộc của quê nhà, Mộc Mì gửi gắm nét mộc mạc và tình yêu dành cho ẩm thực truyền thống. Mời bạn khám phá những hình ảnh sản phẩm và câu chuyện phía sau thương hiệu.</p><div className="actions"><a className="btn btn-primary" href="#products">Khám phá sản phẩm</a><a className="btn btn-outline" href="#video">Xem video chế biến ↗</a></div><div className="hero-note">Ấp Mỹ Huê · Xã Càng Long · Tỉnh Vĩnh Long</div></div><div className="hero-art"><img src={A+'product-mix.jpg'}/><img className="logo-stamp" src={A+'logo.png'}/></div></div></section><section className="section story" id="story"><div className="container story-grid"><div className="story-photo"><img src={A+'product-tray.jpg'}/></div><div className="story-copy"><div className="eyebrow">Câu chuyện Mộc Mì</div><h2>Giữ hương quê trong từng món nhỏ</h2><p>Mộc Mì bắt đầu từ nguyên liệu thân thuộc của miền quê Nam Bộ: củ mì. Qua những công đoạn sơ chế, mài củ mì và chế biến, nguyên liệu dân dã được chăm chút thành món ăn mang dấu ấn riêng.</p><p>Đằng sau mỗi sản phẩm là sự khéo léo, tình yêu ẩm thực và mong muốn gìn giữ nét gần gũi của quê nhà. Mộc Mì trân trọng những điều bình dị và mong được chia sẻ hương vị ấy đến mọi người.</p><div className="story-tags"><span className="tag">Nguyên liệu quê nhà</span><span className="tag">Nét mộc miền Tây</span><span className="tag">Tình yêu ẩm thực</span></div></div></div></section><section className="section products" id="products"><div className="container"><div className="section-head"><div className="eyebrow">Thư viện hình ảnh</div><h2>Sắc màu Mộc Mì</h2><p>Hình ảnh sản phẩm và hoạt động giới thiệu thương hiệu. Chạm vào ảnh để xem kích thước lớn.</p></div><div className="product-grid">{products.map((p)=><article className="product-card" onClick={()=>setPhoto(p)}><img src={A+p[0]}/><div className="product-info"><h3>{p[1]}</h3><p>{p[2]}</p><span className="tap">BẤM ĐỂ XEM ẢNH LỚN ↗</span></div></article>)}</div></div></section><section className="section video" id="video"><div className="container"><div className="section-head"><div className="eyebrow" style={{color:'#e4bd72'}}>Từ gian bếp quê nhà</div><h2>Video giới thiệu Mộc Mì</h2><p>Cùng xem những hình ảnh về quá trình chế biến và câu chuyện sản phẩm.</p></div><div className="video-grid"><div className="video-frame"><iframe src="https://drive.google.com/file/d/1p1jjip58k9QjuzpsC1WrBgNb-h62VgPg/preview" allow="autoplay; fullscreen" allowFullScreen title="Video Mộc Mì"></iframe></div><div className="video-side"><h3>Mộc mạc từ củ mì quê nhà</h3><p>Nếu video không phát trực tiếp, bạn có thể mở video trên Google Drive.</p><a className="btn btn-primary" href="https://drive.google.com/file/d/1p1jjip58k9QjuzpsC1WrBgNb-h62VgPg/view" target="_blank">Mở video trên Google Drive ↗</a></div></div></div></section><section className="section location" id="location"><div className="container location-grid"><div className="address-card"><div className="eyebrow">Tìm đến Mộc Mì</div><h3>Ghé thăm quê nhà</h3><p><strong>Địa chỉ:</strong><br/>Ấp Mỹ Huê, xã Càng Long, tỉnh Vĩnh Long, Việt Nam.</p><p>Mộc Mì trân trọng sự quan tâm và kết nối của quý khách.</p><div className="actions"><a className="btn btn-primary" href="https://maps.app.goo.gl/2DCcf3cYfVBTjCuB9" target="_blank">Mở Google Maps ↗</a><a className="btn btn-outline" href="https://www.google.com/maps/dir/?api=1&destination=Ap+My+Hue%2C+Cang+Long%2C+Vinh+Long%2C+Vietnam" target="_blank">Chỉ đường</a></div></div><a className="mapbox" href="https://maps.app.goo.gl/2DCcf3cYfVBTjCuB9" target="_blank"><div><div className="map-pin">📍</div><strong>MỘC MÌ</strong><span>Ấp Mỹ Huê · Càng Long · Vĩnh Long</span><span style={{marginTop:18,fontWeight:700}}>Nhấn để mở vị trí trên Google Maps ↗</span></div></a></div></section><section className="section contact" id="contact"><div className="container"><div className="contact-box"><div><div className="eyebrow">Kết nối với chúng tôi</div><h2>Thân mời bạn liên hệ</h2><p>Mọi quan tâm về sản phẩm Mộc Mì, vui lòng gọi trực tiếp qua các số điện thoại bên dưới.</p></div><div className="phone-actions"><a className="btn" href="tel:0939214577">☎ 0939 214 577</a><a className="btn" href="tel:033165895">☎ 0331 658 95</a></div></div></div></section></main><footer className="footer"><div className="container footer-row"><div><div className="footer-brand">MỘC MÌ</div><small>THƠM THẢO CỦ MÌ QUÊ NHÀ</small></div><small>© 2026 Mộc Mì · Ấp Mỹ Huê, xã Càng Long, tỉnh Vĩnh Long</small></div></footer>{photo&&<div className="lightbox" onClick={()=>setPhoto(null)}><button className="close">×</button><img src={A+photo[0]}/></div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
